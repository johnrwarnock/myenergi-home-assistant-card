<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myenergi Flow Card — M2 Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --me-bg:    #1a1a1a;
    --me-card:  #303030;
    --me-home:  #F91CDF;
    --me-solar: #55FF00;
    --me-zappi: #0086FF;
    --me-eddi:  #00E6C0;
    --me-libbi: #FF9234;
    --me-leaf:  #84ff00;
    --me-green: #40ff7a;
    --me-muted: #cecdcd;
    --me-chev-g:#55ff00;
    --me-chev-y:#FFD400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Overpass', sans-serif; padding: 32px 16px;
  }
  .stage { width: 100%; max-width: 380px; }
  .label { font-size: 10px; font-weight: 300; color: #555; text-align: center;
           margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .card  { background: var(--me-bg); border-radius: 16px;
           padding: 10px 12px 8px; border: 0.5px solid #2a2a2a; }
  .card-svg { display: block; width: 100%; height: auto; }
  .footer { display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 6px 0 2px; }
  .footer-text { font-family: 'Overpass', sans-serif; font-weight: 800;
                 font-size: 13px; color: var(--me-green); letter-spacing: 0.5px; }
</style>
</head>

      Centre (187,225) r=41  Orbit r=148
      Nodes at 72° intervals from 12-o'clock clockwise:
        0°   Home  (187, 77)   TOP          label y= 30  (above)
        72°  libbi (328,171)   upper-right  label y=124  (above)
        144° Solar (274,340)   lower-right  label y=387  (below)
        216° zappi (100,340)   lower-left   label y=387  (below)
        288° eddi  ( 46,171)   upper-left   label y=124  (above)

      Spoke edge coords (r_node=31, r_centre=41):
        Home  ↔ centre:  (187,108)→(187,184)
        libbi ↔ centre:  (299,182)→(225,210)
        Solar ↔ centre:  (255,315)→(212,258)
        zappi ↔ centre:  (119,315)→(162,258)
        eddi  ↔ centre:  ( 75,182)→(149,210)

      Chevron direction & colour logic (87% self-consumption → yellow):
        solar → centre  always green
        centre → libbi  always green (towards battery)
        centre → home   yellow (87% SC)
        centre → zappi  yellow (87% SC)
        centre → eddi   yellow (87% SC, diverting)

      Status badges: top-RIGHT of each device circle (+22,−22 offset)
